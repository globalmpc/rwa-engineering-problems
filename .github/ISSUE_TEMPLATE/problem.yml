name: Engineering problem
description: A problem you hit while building an RWA product on BNB Chain or another EVM chain.
title: "<one line: what breaks>"
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what breaks, not a product idea. You do not need to propose a solution.
        Issues are public: no credentials, private keys or wallet addresses.
  - type: input
    id: setup
    attributes:
      label: Chain and setup
      description: Chain, node provider, framework or wallet stack.
      placeholder: BNB Chain mainnet, public node, Flutter 3.x
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you did, what happened, what you expected.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters for RWA
      description: Who is blocked, an issuer, a holder, an auditor, a reviewer, and what they cannot do.
    validations:
      required: true
  - type: textarea
    id: close
    attributes:
      label: What would close it
      description: Optional. A library, a tool, a rule set, or leave it to the discussion.
  - type: checkboxes
    id: rules
    attributes:
      label: Before posting
      options:
        - label: This issue contains no credentials, private keys or wallet addresses.
          required: true
